
    <ng-content></ng-content>

    <!-- Dialog Overlay -->
    <div
      *ngIf="isOpen"
      class="fixed inset-0 z-50 bg-background/80 backdrop-blur-sm"
      (click)="close()"
    ></div>

    <!-- Dialog Content -->
    <div
      *ngIf="isOpen"
      class="fixed left-[50%] top-[50%] z-50 translate-x-[-50%] translate-y-[-50%] w-full max-w-lg gap-4 border bg-background p-6 shadow-lg duration-200 sm:rounded-lg"
      (click)="$event.stopPropagation()"
    >
      <ng-content select="[slot=content]"></ng-content>
    </div>
